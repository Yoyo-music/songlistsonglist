<body class="min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- 固定雪地背景图层 (单一档案内嵌，免附图) -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute inset-0 snow-bg-layer"></div>
    </div>

    <!-- 主容器 -->
    <div class="relative z-10 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 flex-grow">
        
        <!-- 1. 页首区 (Header) -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-slate-900/65 backdrop-blur-md border border-sky-300/25 text-sky-200 text-xs font-medium mb-4 shadow-sm">
                <span id="statusDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="dataSourceBadge">目前共收录 236 首歌曲</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white drop-shadow-md mb-2.5">
                歌单曲目
            </h1>
            <p class="text-slate-200/90 text-sm sm:text-base max-w-2xl mx-auto drop-shadow">
                支持歌名/歌手/备注即时检索、语种与热门歌手筛选。点击任意歌曲即可一键复制！
            </p>
        </header>

        <!-- 2. 控制与筛选面板 (Controls Panel) -->
        <section class="bg-slate-900/65 backdrop-blur-xl border border-white/15 rounded-2xl p-4 sm:p-6 mb-6 shadow-2xl space-y-4">
            
            <!-- 搜寻框与随机抽歌按钮 -->
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-grow">

            "杨丞琳", "周兴哲", "方大同", "徐佳莹", "陈奕迅", "莫文蔚", "田馥甄"
        ];

        // 状态管理变数
        let allSongs = [...DEFAULT_SONGS];
        let currentCategory = "全部";
        let currentArtist = "全部歌手";
        let currentSearchQuery = "";
        let currentRandomSong = null;
        let toastTimeout = null;

        // 语言标签配色对应 (同时支援简体与繁体)
        const LANGUAGE_COLORS = {
            "国语": "bg-rose-500/20 text-rose-200 border-rose-400/30",
            "國語": "bg-rose-500/20 text-rose-200 border-rose-400/30",
            "日语": "bg-sky-500/20 text-sky-200 border-sky-400/30",
            "日語": "bg-sky-500/20 text-sky-200 border-sky-400/30",
            "粤语": "bg-amber-500/20 text-amber-200 border-amber-400/30",
            "粵語": "bg-amber-500/20 text-amber-200 border-amber-400/30",
            "英语": "bg-emerald-500/20 text-emerald-200 border-emerald-400/30",
            "英語": "bg-emerald-500/20 text-emerald-200 border-emerald-400/30",
            "闽南语": "bg-purple-500/20 text-purple-200 border-purple-400/30",
            "閩南語": "bg-purple-500/20 text-purple-200 border-purple-400/30",
            "其他": "bg-slate-500/20 text-slate-200 border-slate-400/30"
        };

        // DOM 元素取得
        const searchInput = document.getElementById("searchInput");
        const clearSearchBtn = document.getElementById("clearSearchBtn");
        const languageFiltersContainer = document.getElementById("languageFilters");
        const artistFiltersContainer = document.getElementById("artistFilters");
        const songListContainer = document.getElementById("songListContainer");
        const filteredCountEl = document.getElementById("filteredCount");
        const activeFilterTextEl = document.getElementById("activeFilterText");
        const quickResetBtn = document.getElementById("quickResetBtn");
        const emptyStateEl = document.getElementById("emptyState");
        const resetFiltersBtn = document.getElementById("resetFiltersBtn");
        const randomPickBtn = document.getElementById("randomPickBtn");
        const dataSourceBadge = document.getElementById("dataSourceBadge");

        // 随机抽歌弹出视窗元素
        const randomModal = document.getElementById("randomModal");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const modalCopyBtn = document.getElementById("modalCopyBtn");

        /**
         * 初始化应用程式：先渲染画面，再向 Google 试算表同步歌单
         */
        async function initApp() {
            try {
                localStorage.removeItem("user_google_sheet_csv_url");
            } catch (e) {}

            // 先用内建歌单渲染，让网页打开瞬间就能浏览与搜索
            dataSourceBadge.textContent = `目前共收录 ${allSongs.length} 首歌曲（正在同步云端歌单...）`;
            renderAllFiltersAndSongs();
            setupEventListeners();

            // 向 Google 试算表抓取最新歌单
            await loadPlaylist();
        }

        /**
         * 串接 Google Apps Script API 读取试算表歌单
         */
        async function loadPlaylist() {
            try {
                const response = await fetch(apiURL);
                if (!response.ok) {
                    throw new Error(`HTTP 状态异常: ${response.status}`);
                }
                const rawData = await response.json();
                console.log('成功取得歌单：', rawData);

                // 兼容直接返回数组，或包在 data / songs / rows 里的格式
                const rawList = Array.isArray(rawData)
                    ? rawData
                    : (rawData.songs || rawData.data || rawData.rows || []);

                // 兼容英文栏位名或中文表头（歌名/歌手/语言/备注）
                const formattedSongs = rawList
                    .map(item => ({
                        title: String(item.title ?? item.song ?? item.name ?? item['歌名'] ?? item['歌曲'] ?? '').trim(),
                        artist: String(item.artist ?? item.singer ?? item['歌手'] ?? item['艺人'] ?? '').trim() || '未知歌手',
                        language: String(item.language ?? item.lang ?? item['语言'] ?? item['語言'] ?? item['语种'] ?? '').trim() || '国语',
                        note: String(item.note ?? item.remark ?? item.remarks ?? item['备注'] ?? item['備註'] ?? item['备注 / 版本'] ?? item['版本'] ?? '').trim()
                    }))
                    .filter(song => song.title !== '');

                if (formattedSongs.length > 0) {
                    allSongs = formattedSongs;
                    dataSourceBadge.textContent = `目前共收录 ${allSongs.length} 首歌曲（已同步云端歌单）`;
                    renderAllFiltersAndSongs();
                } else {
                    dataSourceBadge.textContent = `目前共收录 ${allSongs.length} 首歌曲（云端尚无资料）`;
                }
            } catch (error) {
                console.error('读取歌单失败：', error);
                dataSourceBadge.textContent = `目前共收录 ${allSongs.length} 首歌曲（使用预设歌单）`;
            }
        }

        /**
         * 统一重新渲染筛选器与列表
         */
        function renderAllFiltersAndSongs() {
            renderLanguageButtons();
            renderArtistButtons();
            renderSongs();
        }

        /**
         * 语言比对（自动兼容简繁体字，例如试算表填「國語」也能被「国语」筛选到）
         */
        function matchLanguage(songLang, filterCat) {
            if (filterCat === "全部") return true;
            if (!songLang) return false;
            const normalized = String(songLang)
                .replace(/國/g, "国")
                .replace(/語/g, "语")
                .replace(/粵/g, "粤")
                .replace(/閩/g, "闽");
            return normalized.includes(filterCat);
        }

        /**
         * 取得符合目前「语言 + 歌手 + 搜寻词」的歌曲
         */
        function getFilteredSongs() {
            const query = currentSearchQuery.toLowerCase().trim();
            return allSongs.filter(song => {
                const title = String(song.title || "");
                const artist = String(song.artist || "");
                const note = String(song.note || "");

                const matchCategory = matchLanguage(song.language, currentCategory);
                const matchArtist = (currentArtist === "全部歌手") || artist.includes(currentArtist);
                const matchQuery = !query || 
                    title.toLowerCase().includes(query) ||
                    artist.toLowerCase().includes(query) ||
                    note.toLowerCase().includes(query);
                
                return matchCategory && matchArtist && matchQuery;
            });
        }

        /**
         * 渲染语言分类按钮
         */
        function renderLanguageButtons() {
            languageFiltersContainer.innerHTML = "";
            const query = currentSearchQuery.toLowerCase().trim();

            CATEGORIES.forEach(category => {
                const count = allSongs.filter(song => {
                    const title = String(song.title || "");
                    const artist = String(song.artist || "");
                    const note = String(song.note || "");

                    const matchCat = matchLanguage(song.language, category);
                    const matchArt = (currentArtist === "全部歌手") || artist.includes(currentArtist);
                    const matchQ = !query || 
                        title.toLowerCase().includes(query) ||
                        artist.toLowerCase().includes(query) ||
                        note.toLowerCase().includes(query);
                    return matchCat && matchArt && matchQ;
                }).length;

                const isActive = (currentCategory === category);
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = isActive
                    ? "inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-indigo-600 text-white shadow-md shadow-indigo-600/30 transition"
                    : "inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium bg-slate-800/80 text-slate-200 hover:bg-slate-700 hover:text-white border border-white/10 transition";

                btn.innerHTML = `
                    <span>${category}</span>
                    <span class="px-1.5 py-0.2 text-xs rounded-full ${isActive ? 'bg-indigo-800 text-indigo-100' : 'bg-slate-900/90 text-slate-300'}">
                        ${count}
                    </span>
                `;

                btn.addEventListener("click", () => {
                    currentCategory = category;
                    renderAllFiltersAndSongs();
                });

                languageFiltersContainer.appendChild(btn);
            });
        }

        /**
         * 渲染热门歌手快速筛选标签
         */
        function renderArtistButtons() {
            artistFiltersContainer.innerHTML = "";

            POPULAR_ARTISTS.forEach(artist => {
                const isActive = (currentArtist === artist);
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = isActive
                    ? "px-3 py-1 rounded-lg text-xs font-semibold bg-purple-600 text-white shadow-sm transition"
                    : "px-3 py-1 rounded-lg text-xs font-medium bg-slate-950/65 text-slate-300 hover:bg-slate-800 hover:text-white border border-white/10 transition";

                btn.textContent = artist;
                btn.addEventListener("click", () => {
                    currentArtist = artist;
                    renderAllFiltersAndSongs();
                });

                artistFiltersContainer.appendChild(btn);
            });
        }

        /**
         * 渲染歌曲列表
         */
        function renderSongs() {
            const filtered = getFilteredSongs();
            filteredCountEl.textContent = filtered.length;
            songListContainer.innerHTML = "";

            // 更新筛选条件提示与重设按钮
            const hasActiveFilter = currentCategory !== "全部" || currentArtist !== "全部歌手" || currentSearchQuery.trim() !== "";
            quickResetBtn.classList.toggle("hidden", !hasActiveFilter);
            activeFilterTextEl.textContent = hasActiveFilter 
                ? `(筛选：${currentCategory} · ${currentArtist}${currentSearchQuery ? ` · "${currentSearchQuery}"` : ""})` 
                : "";

            if (filtered.length === 0) {
                emptyStateEl.classList.remove("hidden");
                return;
            }
            emptyStateEl.classList.add("hidden");

            filtered.forEach((song, index) => {
                const badgeClass = LANGUAGE_COLORS[song.language] || LANGUAGE_COLORS["其他"];
                const row = document.createElement("div");
                row.id = `song-row-${index}`;
                row.className = "group hover:bg-white/10 active:bg-white/15 transition cursor-pointer px-4 sm:px-6 py-3.5";
                
                row.addEventListener("click", () => copySongToClipboard(song));

                row.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-1.5 sm:gap-4 items-center">
                        <!-- 1. 歌名 -->
                        <div class="sm:col-span-4 flex items-center justify-between sm:justify-start gap-2">
                            <div class="font-semibold text-white group-hover:text-sky-300 transition text-base sm:text-sm">
                                ${escapeHTML(song.title)}
                            </div>
                            <span class="sm:hidden text-xs px-2 py-0.5 rounded-md border ${badgeClass}">
                                ${escapeHTML(song.language)}
                            </span>
                        </div>

                        <!-- 2. 歌手 -->
                        <div class="sm:col-span-3 text-slate-200 text-sm">
                            ${escapeHTML(song.artist)}
                        </div>

                        <!-- 3. 语言 -->
                        <div class="hidden sm:flex sm:col-span-2 items-center">
                            <span class="text-xs px-2.5 py-0.5 rounded-md border font-medium ${badgeClass}">
                                ${escapeHTML(song.language)}
                            </span>
                        </div>

                        <!-- 4. 备注 -->
                        <div class="sm:col-span-2 text-xs text-slate-300/80 truncate" title="${escapeHTML(song.note || '')}">
                            ${song.note ? escapeHTML(song.note) : '<span class="text-slate-500">—</span>'}
                        </div>

                        <!-- 5. 复制按钮 -->
                        <div class="hidden sm:flex sm:col-span-1 justify-end">
                            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-slate-800/80 group-hover:bg-indigo-600 text-slate-200 group-hover:text-white text-xs font-medium border border-white/10 transition">
                                复制
                            </span>
                        </div>
                    </div>
                `;

                songListContainer.appendChild(row);
            });
        }

        /**
         * 复制歌曲到剪贴簿（统一预设为：歌名 - 歌手）
         */
        function copySongToClipboard(song) {
            const textToCopy = `${song.title} - ${song.artist}`;

            const tempInput = document.createElement("textarea");
            tempInput.value = textToCopy;
            tempInput.style.position = "fixed";
            tempInput.style.opacity = "0";
            document.body.appendChild(tempInput);
            tempInput.select();
            
            try {
                document.execCommand("copy");
                showToast(`已复制：「${textToCopy}」`);
            } catch (err) {
                showToast("复制失败，请手动选取复制");
            } finally {
                document.body.removeChild(tempInput);
            }
        }

        /**
         * 显示右下角 Toast 通知
         */
        function showToast(message) {
            const toast = document.getElementById("toastNotification");
            const toastMsg = document.getElementById("toastMessage");
            toastMsg.textContent = message;

            toast.classList.remove("translate-y-20", "opacity-0");
            toast.classList.add("translate-y-0", "opacity-100");

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove("translate-y-0", "opacity-100");
                toast.classList.add("translate-y-20", "opacity-0");
            }, 2500);
        }

        /**
         * 随机抽歌功能
         */
        function pickRandomSong() {
            const filtered = getFilteredSongs();
            if (filtered.length === 0) {
                showToast("目前筛选清单中没有歌曲可抽！");
                return;
            }

            const randomIndex = Math.floor(Math.random() * filtered.length);
            currentRandomSong = filtered[randomIndex];

            const badgeEl = document.getElementById("modalLanguageBadge");
            badgeEl.textContent = currentRandomSong.language;
            badgeEl.className = `inline-block text-xs px-2.5 py-0.5 rounded-md mb-2 border font-medium ${LANGUAGE_COLORS[currentRandomSong.language] || LANGUAGE_COLORS["其他"]}`;

            document.getElementById("modalSongTitle").textContent = currentRandomSong.title;
            document.getElementById("modalSongArtist").textContent = currentRandomSong.artist;
            document.getElementById("modalSongNote").textContent = currentRandomSong.note || "";

            randomModal.classList.remove("hidden");

            const targetRow = document.getElementById(`song-row-${randomIndex}`);
            if (targetRow) {
                targetRow.scrollIntoView({ behavior: "smooth", block: "center" });
                targetRow.classList.remove("song-highlight");
                void targetRow.offsetWidth;
                targetRow.classList.add("song-highlight");
            }
        }

        function escapeHTML(str) {
            if (str === null || str === undefined) return "";
            return String(str).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }

        function resetAllFilters() {
            searchInput.value = "";
            currentSearchQuery = "";
            currentCategory = "全部";
            currentArtist = "全部歌手";
            clearSearchBtn.classList.add("hidden");
            renderAllFiltersAndSongs();
        }

        /**
         * 绑定事件监听器
         */
        function setupEventListeners() {
            searchInput.addEventListener("input", (e) => {
                currentSearchQuery = e.target.value;
                clearSearchBtn.classList.toggle("hidden", currentSearchQuery.length === 0);
                renderAllFiltersAndSongs();
            });

            clearSearchBtn.addEventListener("click", () => {
                searchInput.value = "";
                currentSearchQuery = "";
                clearSearchBtn.classList.add("hidden");
                renderAllFiltersAndSongs();
                searchInput.focus();
            });

            resetFiltersBtn.addEventListener("click", resetAllFilters);
            quickResetBtn.addEventListener("click", resetAllFilters);

            // 随机抽歌弹窗
            randomPickBtn.addEventListener("click", pickRandomSong);
            closeModalBtn.addEventListener("click", () => randomModal.classList.add("hidden"));
            randomModal.addEventListener("click", (e) => {
                if (e.target === randomModal) randomModal.classList.add("hidden");
            });
            modalCopyBtn.addEventListener("click", () => {
                if (currentRandomSong) {
                    copySongToClipboard(currentRandomSong);
                    randomModal.classList.add("hidden");
                }
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
